name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        dependencies: [latest]
        include:
          - python: '3.10'
            dependencies: minimum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - if: matrix.dependencies == 'minimum'
        run: python -m pip install 'strands-agents==1.59.0' 'sprites-py==0.7.2'
      - run: python -m pytest --cov=strands_sprites --cov-report=term-missing
      - if: matrix.python == '3.10' && matrix.dependencies == 'latest'
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src
          python -m build
          python -m twine check dist/*
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -I -c "from strands_sprites import SpritesSandbox; print(SpritesSandbox.__name__)"
