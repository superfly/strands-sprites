name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        resolution: [highest]
        include:
          - python: '3.10'
            resolution: lowest-direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install dependencies in a clean environment
        env:
          RESOLUTION: ${{ matrix.resolution }}
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python --resolution "$RESOLUTION" -e '.[dev]'
          uv pip check --python .venv/bin/python
      - run: .venv/bin/python -m pytest --cov=strands_sprites --cov-report=term-missing
      - if: matrix.python == '3.10' && matrix.resolution == 'highest'
        run: |
          .venv/bin/python -m ruff check .
          .venv/bin/python -m ruff format --check .
          .venv/bin/python -m mypy src scripts
          .venv/bin/python -m build
          .venv/bin/python -m twine check dist/*
          uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
          .venv/bin/python -I -c "from strands_sprites import SpritesSandbox; print(SpritesSandbox.__name__)"

  sdk-compat:
    name: Latest SDK compatibility
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install newest published SDKs
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e '.[dev]'
          uv pip install --python .venv/bin/python --upgrade strands-agents sprites-py
          uv pip check --python .venv/bin/python
      - run: |
          .venv/bin/python -m mypy src scripts
          .venv/bin/python -m pytest
